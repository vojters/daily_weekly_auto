<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #f5b041;
            --primary-hover: #d49632;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 700px;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .debug-panel {
            background-color: #000;
            border: 1px solid #0f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #0f0;
            text-align: left;
        }
        .form-group {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #252525;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        label.section-title {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
            text-transform: uppercase;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 10px;
        }
        input[type="text"]:last-child {
            margin-bottom: 0;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .custom-file-upload {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            border: 1px solid #555;
            text-transform: uppercase;
        }
        .custom-file-upload:hover {
            background-color: #444;
        }
        .file-name {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        button.main-btn {
            flex: 1;
            padding: 16px;
            background-color: var(--primary);
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        button.main-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        .preview-box {
            margin-top: 25px;
            text-align: center;
            display: none;
        }
        .preview-box img {
            max-width: 100%;
            border-radius: 8px;
            border: 2px solid #444;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Results Generator</h1>
        
        <!-- Tento rámeček ti potvrdí, jaká čísla web skutečně čte -->
        <div class="debug-panel" id="config-display">Načítám aktuální CONFIG...</div>
        
        <div class="form-group">
            <label class="section-title">1. Header Texts</label>
            <input type="text" id="dateText" placeholder="Event Date (e.g. 11th August 2026)">
            <input type="text" id="trackText" placeholder="Track Name (e.g. The Dunes)">
        </div>

        <div class="form-group">
            <label class="section-title">2. Main Screenshot</label>
            <div class="file-upload-wrapper">
                <label class="custom-file-upload">
                    <input type="file" id="firstScreen" accept="image/*" onchange="updateFileName('firstScreen', 'firstScreenName')">
                    BROWSE
                </label>
                <span class="file-name" id="firstScreenName">No file chosen</span>
            </div>
        </div>

        <div class="form-group">
            <label class="section-title">3. Additional Screenshots</label>
            <div class="file-upload-wrapper">
                <label class="custom-file-upload">
                    <input type="file" id="otherScreens" accept="image/*" multiple onchange="updateFileName('otherScreens', 'otherScreensName')">
                    BROWSE
                </label>
                <span class="file-name" id="otherScreensName">No files chosen</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="main-btn" id="generateBtn" onclick="generateCollage()">1. PREVIEW</button>
            <button class="main-btn" id="downloadBtn" onclick="downloadCollage()" disabled>2. DOWNLOAD</button>
        </div>
        
        <div id="statusMsg" class="status"></div>

        <div class="preview-box" id="previewContainer">
            <label class="section-title">Preview</label>
            <img id="previewImg" src="" alt="Collage Preview">
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION (Set once and forget)
        // ==========================================
        const CONFIG = {
            // Global side crops
            cropLeft: 600,       
            cropRight: 400,      

            // First Screenshot (Header & First rows)
            firstScreenCropTop: 240,    
            firstScreenCropBottom: 0,   

            // Additional Screenshots (Continuing rows)
            otherScreenCropTop: 660,    
            otherScreenCropBottom: 0,   
            
            // Úplně poslední screenshot v řadě (Pro odstranění 21. hráče)
            lastScreenCropBottom: 120,  

            // Text Placement 
            dateTextY: 120,          
            trackTextY: 250,         

            // Logo Details
            logoX: 30,
            logoY: 60,
            logoSize: 300
        };
        // ==========================================

        // Zobrazení CONFIGu na obrazovce pro kontrolu
        window.onload = function() {
            document.getElementById('config-display').innerHTML = 
                "LATEST CONFIGURATION :<br><br>" + 
                JSON.stringify(CONFIG, null, 2).replace(/\n/g, '<br>').replace(/ /g, '&nbsp;');
        };

        let finalImageURL = "";

        function updateFileName(inputId, textId) {
            const input = document.getElementById(inputId);
            const text = document.getElementById(textId);
            if (input.files && input.files.length > 1) {
                text.innerText = input.files.length + " files chosen";
            } else if (input.files && input.files.length === 1) {
                text.innerText = input.files[0].name;
            } else {
                text.innerText = "No file chosen";
            }
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                if (!file) { resolve(null); return; }
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        function loadRepoLogo() {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = 'logo.png';
            });
        }

        async function generateCollage() {
            const statusMsg = document.getElementById('statusMsg');
            const genBtn = document.getElementById('generateBtn');
            const dlBtn = document.getElementById('downloadBtn');
            const previewContainer = document.getElementById('previewContainer');
            const previewImg = document.getElementById('previewImg');

            statusMsg.style.color = '#aaaaaa';
            statusMsg.innerText = 'Processing images...';
            genBtn.disabled = true;
            dlBtn.disabled = true;

            try {
                const dateText = document.getElementById('dateText').value;
                const trackText = document.getElementById('trackText').value;
                const firstScreenFile = document.getElementById('firstScreen').files[0];
                const otherScreenFiles = Array.from(document.getElementById('otherScreens').files);

                if (!firstScreenFile) throw new Error("Main screenshot is required.");

                const firstImg = await loadImage(firstScreenFile);
                const logoImg = await loadRepoLogo();
                const otherImgs = [];
                for (let file of otherScreenFiles) {
                    otherImgs.push(await loadImage(file));
                }
                
                // Využití pevného CONFIGu
                const targetWidth = firstImg.width - CONFIG.cropLeft - CONFIG.cropRight;
                const firstScreenHeight = firstImg.height - CONFIG.firstScreenCropTop - CONFIG.firstScreenCropBottom;
                
                let totalHeight = firstScreenHeight;
                const otherHeights = [];
                
                for (let i = 0; i < otherImgs.length; i++) {
                    // Logika pro odříznutí posledního řádku pouze z posledního screenshotu
                    let currentBottomCrop = CONFIG.otherScreenCropBottom;
                    if (i === otherImgs.length - 1) {
                        currentBottomCrop = CONFIG.lastScreenCropBottom;
                    }
                    
                    const h = otherImgs[i].height - CONFIG.otherScreenCropTop - currentBottomCrop;
                    otherHeights.push(h);
                    totalHeight += h;
                }

                const canvas = document.createElement('canvas');
                canvas.width = targetWidth;
                canvas.height = totalHeight;
                const ctx = canvas.getContext('2d');

                // Vykreslení prvního screenu
                ctx.drawImage(
                    firstImg, 
                    CONFIG.cropLeft, CONFIG.firstScreenCropTop, targetWidth, firstScreenHeight,
                    0, 0, targetWidth, firstScreenHeight
                );

                // Logo
                if (logoImg) {
                    ctx.drawImage(logoImg, CONFIG.logoX, CONFIG.logoY, CONFIG.logoSize, CONFIG.logoSize);
                }

                // Text
                ctx.textAlign = "center";
                ctx.lineJoin = "round";
                ctx.lineWidth = 36; 
                ctx.strokeStyle = "black";
                ctx.fillStyle = "white";

                const centerX = targetWidth / 2;

                if (dateText) {
                    ctx.font = "900 130px 'Arial Black', Impact, sans-serif";
                    ctx.strokeText(dateText, centerX, CONFIG.dateTextY);
                    ctx.fillText(dateText, centerX, CONFIG.dateTextY);
                }

                if (trackText) {
                    ctx.font = "900 120px 'Arial Black', Impact, sans-serif";
                    ctx.strokeText(trackText, centerX, CONFIG.trackTextY);
                    ctx.fillText(trackText, centerX, CONFIG.trackTextY);
                }

                // Vykreslení dalších screenů
                let currentY = firstScreenHeight;
                for (let i = 0; i < otherImgs.length; i++) {
                    const img = otherImgs[i];
                    const h = otherHeights[i];
                    
                    // Nastavení správného ořezu zespodu
                    let currentBottomCrop = CONFIG.otherScreenCropBottom;
                    if (i === otherImgs.length - 1) {
                        currentBottomCrop = CONFIG.lastScreenCropBottom;
                    }

                    ctx.drawImage(
                        img, 
                        CONFIG.cropLeft, CONFIG.otherScreenCropTop, targetWidth, h,
                        0, currentY, targetWidth, h
                    );
                    currentY += h;
                }

                finalImageURL = canvas.toDataURL('image/jpeg', 0.92);
                previewImg.src = finalImageURL;
                previewContainer.style.display = 'block';

                dlBtn.disabled = false;
                statusMsg.style.color = '#4CAF50';
                statusMsg.innerText = 'Preview generated successfully.';

            } catch (error) {
                statusMsg.style.color = '#f44336';
                statusMsg.innerText = error.message;
            } finally {
                genBtn.disabled = false;
            }
        }

        function downloadCollage() {
            if (!finalImageURL) return;

            const trackText = document.getElementById('trackText').value.trim();
            let safeName = trackText.replace(/[^a-zA-Z0-9]/g, '');
            if (!safeName) safeName = 'Event';
            
            const fileName = safeName.substring(0, 15) + '.jpg';

            const link = document.createElement('a');
            link.download = fileName;
            link.href = finalImageURL;
            link.click();
        }
    </script>
</body>
</html>
